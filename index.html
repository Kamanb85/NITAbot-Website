<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>NITAbot for MK WORLD</title>
        <meta name="description" content="マリオカートワールドのNITA (ノーアイテムタイムアタック) 記録管理ツールです！記録の登録・確認・統計情報の閲覧をwebサイトで簡単に！" />
        <meta name="format-detection" content="telephone=no, address=no, email=no" />

        <!-- favicon/webclipicon -->
        <link rel="icon" href="https://raw.githubusercontent.com/Kamanb85/NITAbot-Website/main/img/nita.png" />
        <link rel="icon" href="https://raw.githubusercontent.com/Kamanb85/NITAbot-Website/main/img/nita.png" type="image/svg+xml">
        <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/Kamanb85/NITAbot-Website/main/img/nita.png" />

        <!-- ogp -->
        <meta property="og:site_name" content="NITAbot - Website" />
        <meta property="og:url" content="URL" />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="NITAbot - Website" />
        <meta property="og:description" content="マリオカートワールドのNITA (ノーアイテムタイムアタック)用の記録管理ツールです。記録の登録・確認・統計情報の閲覧などを簡単に行えます。" />
        <meta property="og:image" content="https://raw.githubusercontent.com/Kamanb85/NITAbot-Website/main/img/image_thumbnail.png" />
        <meta property="og:locale" content="ja_JP" />
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:image" content="https://raw.githubusercontent.com/Kamanb85/NITAbot-Website/main/img/nita.png" />

        <!-- web font -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&family=Noto+Sans+JP:wght@300&display=swap" rel="stylesheet">

        <!-- css -->
        <link rel="stylesheet" href="./style.css" />

        <!-- js -->
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="./script.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
        <script>eruda.init();</script>
    </head>

    <body>
        <h1 class="midasi">NITAbot<br>Web site</h1>
        <div id="overlay" class="overlay"></div>
        <div class="menu_sidebar" id="menu_sidebar">
            <div id="menu_submit">
                <img src="https://raw.githubusercontent.com/Kamanb85/NITAbot-Website/main/img/menu/menu_submit.png" alt="記録登録" class="menu_image">
                <p class="menu_txt">記録登録</p>
            </div>
            <div id="menu_list">
                <img src="https://raw.githubusercontent.com/Kamanb85/NITAbot-Website/main/img/menu/menu_list.png" alt="記録一覧" class="menu_image">
                <p class="menu_txt">記録一覧</p>
            </div>
            <div id="menu_stats">
                <img src="https://raw.githubusercontent.com/Kamanb85/NITAbot-Website/main/img/menu/menu_stats.png" alt="統計情報" class="menu_image">
                <p class="menu_txt">統計情報</p>
            </div>
            <div id="menu_delete">
                <img src="https://raw.githubusercontent.com/Kamanb85/NITAbot-Website/main/img/menu/menu_delete.png" alt="記録削除" class="menu_image">
                <p class="menu_txt">記録削除</p>
            </div>
            <div id="menu_profile">
                <img src="https://raw.githubusercontent.com/Kamanb85/NITAbot-Website/main/img/menu/menu_profile.png" alt="プロフィール" class="menu_image">
                <p class="menu_txt">プロフィール</p>
            </div>
        </div>
        <button id="menu-btn" class="hamburger-btn">
            <div class="hamburger-icon">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <span class="menu_text">menu</span>
        </button>

        <!-- 非ログイン時-->
        <div id="log_out">
            <h2>ログインしていません</h2>
            <p>NITAbotを利用するには、Discordでログインしてください</p>
            <button id="login_btn">
                <img src="https://raw.githubusercontent.com/Kamanb85/NITAbot-Website/main/img/profile/discord.png" alt="discordアイコン画像" id="login_btn_img">
                <span id="login_btn_text">  Discordでログイン  </span>
            </button>
        </div>

        <!-- ログイン後-->
        <div id="user_dashboard" class="glass-card" style="display: none;">
            <div class="dash_header">
                <div class="user_info">
                    <img id="user_avatar" src="https://raw.githubusercontent.com/Kamanb85/NITAbot-Website/main/img/nita.png" alt="ユーザーアイコン" class="user_avatar">
                    <span id="user_name" class="user_name">@ユーザーネーム</span>
                </div>
                <button id="logout_btn" class="logout_btn">
                    <img src="https://raw.githubusercontent.com/Kamanb85/NITAbot-Website/main/img/profile/log_out.png" alt="ログアウト" class="logout_img">
                    <span>ログアウト</span>
                </button>
            </div>

            <div class="dash_body">
                <div class="ochi_grid">
                    <div class="ochi_item" data-ochi="1">
                        <span class="ochi_badge">1落ち</span>
                        <span class="ochi_value">0 コース</span>
                    </div>
                    <div class="ochi_item" data-ochi="2">
                        <span class="ochi_badge">2落ち</span>
                        <span class="ochi_value">0 コース</span>
                    </div>
                    <div class="ochi_item" data-ochi="3">
                        <span class="ochi_badge">3落ち</span>
                        <span class="ochi_value">0 コース</span>
                    </div>
                    <div class="ochi_item" data-ochi="4">
                        <span class="ochi_badge">4落ち</span>
                        <span class="ochi_value">0 コース</span>
                    </div>
                    <div class="ochi_item" data-ochi="5">
                        <span class="ochi_badge">5落ち</span>
                        <span class="ochi_value">0 コース</span>
                    </div>
                    <div class="ochi_item" data-ochi="6">
                        <span class="ochi_badge">6落ち以上</span>
                        <span class="ochi_value">0 コース</span>
                    </div>
                </div>

                <div class="dash_actions">
                    <button id="dash_submit_btn" class="dash_action_btn btn_submit">
                        <span>記録を登録する</span>
                    </button>
                    <button id="dash_list_btn" class="dash_action_btn btn_list">
                        <span>記録を確認する</span>
                    </button>
                </div>
            </div>    
    </body>
</html>
